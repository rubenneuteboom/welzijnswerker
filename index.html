<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>RPA Instrumenten - Relationeel-Positioneel Analysemodel</title>
    <style>
        :root {
            --primary: #2ECC71;
            --primary-light: #E8F8F0;
            --primary-dark: #27AE60;
            --text: #1f2937;
            --text-light: #4b5563;
            --bg: #F0FFF4;
            --white: #fff;
            --shadow: 0 4px 20px rgba(46, 204, 113, 0.15);
            --radius: 16px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: var(--bg);
            min-height: 100vh;
            padding-bottom: 3rem;
        }

        /* Header met navigatie */
        header {
            background: var(--white);
            box-shadow: var(--shadow);
            padding: 1.5rem 2rem;
            border-bottom: 3px solid var(--primary);
        }

        .header-content {
            max-width: 1400px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 2rem;
            align-items: center;
        }

        h1 {
            color: var(--text);
            font-size: 1.5rem;
            font-weight: 600;
            text-align: center;
        }

        .subtitle {
            color: var(--text-light);
            font-size: 0.95rem;
            text-align: center;
        }

        /* Navigatie knoppen */
        nav {
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
            max-width: 500px;
        }

        .nav-btn {
            background: var(--white);
            border: 2px solid #e5e7eb;
            border-left: 4px solid #e5e7eb;
            color: var(--text);
            padding: 1rem 1.25rem;
            border-radius: 8px;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            gap: 0.75rem;
            text-align: left;
        }

        .nav-btn:hover {
            background: var(--primary-light);
            border-left-color: var(--primary);
            transform: translateX(4px);
        }

        .nav-btn.active {
            background: var(--primary-light);
            border-left-color: var(--primary);
            border-left-width: 6px;
            font-weight: 700;
        }

        .nav-icon {
            font-size: 1.5rem;
            flex-shrink: 0;
        }

        .nav-text {
            flex: 1;
        }

        .nav-badge {
            background: var(--primary);
            color: white;
            padding: 2px 8px;
            border-radius: 12px;
            font-size: 0.7rem;
            font-weight: 700;
            text-transform: uppercase;
        }



        /* Responsive */
        @media (max-width: 768px) {
            header {
                padding: 1rem;
            }

            h1 {
                font-size: 1.25rem;
            }

            nav {
                max-width: 100%;
            }

            .nav-icon {
                font-size: 1.25rem;
            }
        }
    </style>
</head>
<body>
    <header>
        <div class="header-content">
            <div>
                <h1>RPA Instrumenten</h1>
                <p class="subtitle">Relationeel-Positioneel Analysemodel</p>
            </div>
            <nav>
                <!-- RPA METHODIEK -->
                <button class="nav-btn" data-page="netwerkanalyse.html">
                    <span class="nav-icon">📊</span>
                    <span class="nav-text">Niveau 1 - Balanscheck</span>
                </button>
                
                <button class="nav-btn" data-page="positioneel.html">
                    <span class="nav-icon">🔄</span>
                    <span class="nav-text">Niveau 2 - Positionele Analyse</span>
                </button>
                
                <button class="nav-btn" data-page="strategisch.html">
                    <span class="nav-icon">📈</span>
                    <span class="nav-text">Niveau 3 - Strategische Analyse</span>
                </button>
                
                <!-- PORTALEN -->
                <button class="nav-btn" data-page="familie-portal-pro.html">
                    <span class="nav-icon">👨‍👩‍👧</span>
                    <span class="nav-text">Familie Portal</span>
                </button>
                
                <button class="nav-btn" data-page="familie-portal-mdo.html">
                    <span class="nav-icon">👥</span>
                    <span class="nav-text">MDO Portal</span>
                </button>
            </nav>
        </div>
    </header>

    <script>
        const buttons = document.querySelectorAll('.nav-btn');

        buttons.forEach(button => {
            button.addEventListener('click', () => {
                const page = button.getAttribute('data-page');
                
                // Navigate to the page (full window)
                window.location.href = page;
            });
        });
    </script>
</body>
</html>
