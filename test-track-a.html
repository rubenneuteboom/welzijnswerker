<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <title>Track A Test</title>
    <style>
        body { font-family: sans-serif; padding: 20px; }
        .domain-card { 
            display: inline-block;
            padding: 20px;
            margin: 10px;
            border: 2px solid #ccc;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .domain-card.selected {
            border-color: #2ECC71;
            background: #E8F8F0;
        }
        .domain-card:hover {
            transform: scale(1.05);
        }
        button {
            padding: 12px 24px;
            margin: 10px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
        }
        .btn-primary {
            background: #2ECC71;
            color: white;
        }
        #output {
            margin-top: 20px;
            padding: 20px;
            background: #f0f0f0;
            border-radius: 8px;
        }
    </style>
</head>
<body>
    <h1>🎯 Track A - Test</h1>
    
    <h2>Stap 1: Wat wil je bereiken?</h2>
    <textarea id="hulpvraag" rows="3" style="width: 100%; padding: 10px;" placeholder="Bijv: Ik wil minder eenzaam zijn"></textarea>
    
    <h2>Stap 2: Selecteer 1-3 domeinen</h2>
    <div id="domains"></div>
    
    <button class="btn-primary" onclick="submit()">Ga verder →</button>
    
    <div id="output"></div>

    <script>
        const state = {
            hulpvraag: '',
            selectedDomains: []
        };

        const domains = [
            { id: 'financien', emoji: '💰', name: 'Financiën' },
            { id: 'dagbesteding', emoji: '💼', name: 'Dagbesteding' },
            { id: 'huisvesting', emoji: '🏠', name: 'Huisvesting' },
            { id: 'sociaal', emoji: '👥', name: 'Sociaal netwerk' },
            { id: 'participatie', emoji: '🤝', name: 'Participatie' }
        ];

        function renderDomains() {
            const container = document.getElementById('domains');
            container.innerHTML = '';
            
            domains.forEach(d => {
                const card = document.createElement('div');
                card.className = 'domain-card';
                if (state.selectedDomains.includes(d.id)) {
                    card.classList.add('selected');
                }
                card.innerHTML = `
                    <div style="font-size: 2rem;">${d.emoji}</div>
                    <div style="font-weight: bold;">${d.name}</div>
                `;
                card.onclick = () => toggleDomain(d.id);
                container.appendChild(card);
            });
        }

        function toggleDomain(id) {
            console.log('Toggle:', id);
            const idx = state.selectedDomains.indexOf(id);
            if (idx > -1) {
                state.selectedDomains.splice(idx, 1);
                console.log('Removed:', id);
            } else {
                if (state.selectedDomains.length >= 3) {
                    alert('Max 3 domeinen');
                    return;
                }
                state.selectedDomains.push(id);
                console.log('Added:', id);
            }
            console.log('Current selection:', state.selectedDomains);
            renderDomains();
        }

        function submit() {
            const hulpvraag = document.getElementById('hulpvraag').value.trim();
            
            if (!hulpvraag) {
                alert('Vul eerst je hulpvraag in');
                return;
            }
            
            if (state.selectedDomains.length === 0) {
                alert('Selecteer minimaal 1 domein');
                return;
            }
            
            state.hulpvraag = hulpvraag;
            
            document.getElementById('output').innerHTML = `
                <h3>✅ Gelukt!</h3>
                <p><strong>Hulpvraag:</strong> ${state.hulpvraag}</p>
                <p><strong>Geselecteerde domeinen:</strong> ${state.selectedDomains.join(', ')}</p>
            `;
            
            console.log('SUCCESS:', state);
        }

        // Initialize
        renderDomains();
    </script>
</body>
</html>
