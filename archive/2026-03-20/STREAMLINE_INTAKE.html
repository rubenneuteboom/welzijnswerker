<!-- NIEUW STREAMLINED INTRO SCREEN -->
<div class="screen" id="screen-intro">
    <div class="card" style="max-width: 700px; margin: 0 auto;">
        <!-- Header -->
        <div style="text-align: center; margin-bottom: 32px;">
            <h1 style="font-size: 2.2rem; margin-bottom: 8px; color: var(--primary); font-weight: 800;">
                🔄 RPA Positionele Analyse
            </h1>
            <p style="font-size: 1rem; color: #4b5563;">
                Start een nieuwe analyse in 3 stappen
            </p>
        </div>

        <!-- Stap 1: Organisatie -->
        <div class="form-section" style="margin-bottom: 28px;">
            <label style="display: block; font-weight: 700; font-size: 1.1rem; color: #1e293b; margin-bottom: 12px;">
                1️⃣ Voor welke organisatie werk je?
            </label>
            <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px;">
                <label class="mode-card" style="cursor: pointer;">
                    <input type="radio" name="modus" value="jeugdzorg" onchange="selectMode('jeugdzorg')" style="display: none;">
                    <div class="mode-content" style="border: 2px solid #e5e7eb; border-radius: 10px; padding: 14px; text-align: center; transition: all 0.2s;">
                        <div style="font-size: 1.8rem; margin-bottom: 4px;">👨‍👩‍👦</div>
                        <div style="font-size: 0.9rem; font-weight: 600; color: #1e293b;">Jeugdzorg</div>
                    </div>
                </label>
                <label class="mode-card" style="cursor: pointer;">
                    <input type="radio" name="modus" value="ggz" onchange="selectMode('ggz')" style="display: none;">
                    <div class="mode-content" style="border: 2px solid #e5e7eb; border-radius: 10px; padding: 14px; text-align: center; transition: all 0.2s;">
                        <div style="font-size: 1.8rem; margin-bottom: 4px;">🧠</div>
                        <div style="font-size: 0.9rem; font-weight: 600; color: #1e293b;">GGZ</div>
                    </div>
                </label>
                <label class="mode-card" style="cursor: pointer;">
                    <input type="radio" name="modus" value="wijkteam" onchange="selectMode('wijkteam')" style="display: none;">
                    <div class="mode-content" style="border: 2px solid #e5e7eb; border-radius: 10px; padding: 14px; text-align: center; transition: all 0.2s;">
                        <div style="font-size: 1.8rem; margin-bottom: 4px;">🏘️</div>
                        <div style="font-size: 0.9rem; font-weight: 600; color: #1e293b;">Wijkteam</div>
                    </div>
                </label>
                <label class="mode-card" style="cursor: pointer;">
                    <input type="radio" name="modus" value="ouderenzorg" onchange="selectMode('ouderenzorg')" style="display: none;">
                    <div class="mode-content" style="border: 2px solid #e5e7eb; border-radius: 10px; padding: 14px; text-align: center; transition: all 0.2s;">
                        <div style="font-size: 1.8rem; margin-bottom: 4px;">👴</div>
                        <div style="font-size: 0.9rem; font-weight: 600; color: #1e293b;">Ouderenzorg</div>
                    </div>
                </label>
                <label class="mode-card" style="cursor: pointer;">
                    <input type="radio" name="modus" value="schuldhulp" onchange="selectMode('schuldhulp')" style="display: none;">
                    <div class="mode-content" style="border: 2px solid #e5e7eb; border-radius: 10px; padding: 14px; text-align: center; transition: all 0.2s;">
                        <div style="font-size: 1.8rem; margin-bottom: 4px;">💰</div>
                        <div style="font-size: 0.9rem; font-weight: 600; color: #1e293b;">Schuldhulp</div>
                    </div>
                </label>
                <label class="mode-card" style="cursor: pointer;">
                    <input type="radio" name="modus" value="verslavingszorg" onchange="selectMode('verslavingszorg')" style="display: none;">
                    <div class="mode-content" style="border: 2px solid #e5e7eb; border-radius: 10px; padding: 14px; text-align: center; transition: all 0.2s;">
                        <div style="font-size: 1.8rem; margin-bottom: 4px;">🚭</div>
                        <div style="font-size: 0.9rem; font-weight: 600; color: #1e293b;">Verslaving</div>
                    </div>
                </label>
            </div>
        </div>

        <!-- Stap 2: Naam -->
        <div class="form-section" style="margin-bottom: 28px;">
            <label for="clientName" style="display: block; font-weight: 700; font-size: 1.1rem; color: #1e293b; margin-bottom: 8px;">
                2️⃣ Naam cliënt *
            </label>
            <input 
                type="text" 
                id="clientName" 
                placeholder="Bijv. Tim Jansen of T.J. (initialen)" 
                style="width: 100%; padding: 12px 16px; border: 2px solid #e5e7eb; border-radius: 10px; font-size: 1rem; font-family: inherit;"
                oninput="state.clientName = this.value; saveState();"
            >
            <p style="font-size: 0.85rem; color: #6b7280; margin-top: 6px;">
                ℹ️ Voor jouw administratie. Bij export wordt dit geanonimiseerd.
            </p>
        </div>

        <!-- Stap 3: Track -->
        <div class="form-section" style="margin-bottom: 32px;">
            <label style="display: block; font-weight: 700; font-size: 1.1rem; color: #1e293b; margin-bottom: 12px;">
                3️⃣ Welke aanpak kies je?
            </label>
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 14px;">
                <label style="cursor: pointer;">
                    <input type="radio" name="track" value="volledig" checked onchange="state.track = 'volledig'; saveState();" style="display: none;">
                    <div style="border: 2px solid #3b82f6; background: #dbeafe; border-radius: 10px; padding: 18px; transition: all 0.2s;">
                        <div style="font-size: 1.5rem; margin-bottom: 8px;">📋</div>
                        <div style="font-weight: 700; color: #1e40af; margin-bottom: 6px;">Volledig</div>
                        <div style="font-size: 0.85rem; color: #1e3a8a;">Alle 11 domeinen + positionering</div>
                    </div>
                </label>
                <label style="cursor: pointer;">
                    <input type="radio" name="track" value="quick" onchange="state.track = 'quick'; saveState();" style="display: none;">
                    <div style="border: 2px solid #e5e7eb; background: white; border-radius: 10px; padding: 18px; transition: all 0.2s;">
                        <div style="font-size: 1.5rem; margin-bottom: 8px;">⚡</div>
                        <div style="font-weight: 700; color: #1e293b; margin-bottom: 6px;">Quick Scan</div>
                        <div style="font-size: 0.85rem; color: #6b7280;">Alleen urgente domeinen</div>
                    </div>
                </label>
            </div>
        </div>

        <!-- Start Button -->
        <button 
            onclick="startAnalyse()"
            style="width: 100%; padding: 16px; background: linear-gradient(135deg, #2ECC71, #27AE60); color: white; border: none; border-radius: 12px; font-size: 1.1rem; font-weight: 700; cursor: pointer; box-shadow: 0 4px 12px rgba(46, 204, 113, 0.3); transition: all 0.2s;"
            onmouseover="this.style.transform='translateY(-2px)'; this.style.boxShadow='0 6px 16px rgba(46, 204, 113, 0.4)';"
            onmouseout="this.style.transform=''; this.style.boxShadow='0 4px 12px rgba(46, 204, 113, 0.3)';"
        >
            Start Analyse →
        </button>
    </div>
</div>

<style>
/* Enhanced mode card styling */
.mode-card input:checked + .mode-content {
    border-color: var(--primary) !important;
    background: var(--primary-light) !important;
    box-shadow: 0 4px 12px rgba(46, 204, 113, 0.2);
    transform: translateY(-2px);
}

.mode-card:hover .mode-content {
    border-color: var(--primary);
    transform: translateY(-1px);
}

input[name="track"]:checked + div {
    border-color: var(--primary) !important;
    background: var(--primary-light) !important;
    box-shadow: 0 4px 12px rgba(46, 204, 113, 0.2);
}
</style>

<script>
function startAnalyse() {
    // Validate
    if (!state.mode) {
        alert('Kies eerst een organisatie');
        return;
    }
    if (!state.clientName || !state.clientName.trim()) {
        alert('Vul een naam in voor de cliënt');
        document.getElementById('clientName').focus();
        return;
    }
    
    // Go directly to domains
    goToScreen(4); // Screen 4 = domains in current setup
}
</script>
